server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json;
  # The container sits behind a port mapping (8081 -> 80): a redirect must not carry nginx's own port.
  absolute_redirect off;
  # ES modules: revalidate on every load so a new deploy is picked up immediately.
  location ~* \.(js|css|html|json)$ { add_header Cache-Control "no-cache"; try_files $uri =404; }
  # Pages are folders with an index.html (/gia-lap/, /bai-hoc/); $uri/ serves them and adds a missing slash.
  location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
